<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fresh Veggie Admin Dashboard</title>
  <style>
    :root {
      --green: #16823b;
      --green-dark: #0f5c2a;
      --bg: #f0f4f1;
      --line: #d8e6dc;
      --danger: #d9534f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); padding-bottom: 50px; }
    header { background: var(--green-dark); color: white; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 720px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat-card { background: white; border-radius: 10px; padding: 12px; border: 1px solid var(--line); text-align: center; }
    .stat-num { font-size: 20px; font-weight: 800; color: var(--green-dark); margin-top: 4px; }
    .order-card { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
    .order-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--line); padding-bottom: 8px; margin-bottom: 8px; }
    .order-id { font-weight: 800; color: var(--green-dark); }
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .badge-placed { background: #fff3cd; color: #856404; }
    .badge-delivered { background: #d4edda; color: #155724; }
    .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; }
    .btn-update { background: var(--green); color: white; }
    .btn-del { background: #fbeae8; color: var(--danger); border: 1px solid #f5c6cb; }
    #adminAuthScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .auth-box { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 24px; max-width: 320px; width: 100%; text-align: center; }
    .auth-box input { width: 100%; padding: 10px; font-size: 18px; text-align: center; border: 1px solid var(--line); border-radius: 8px; margin: 12px 0; letter-spacing: 4px; }
  </style>
</head>
<body>
  <div id="adminAuthScreen">
    <div class="auth-box">
      <div style="font-size: 36px; margin-bottom: 8px;">🔐</div>
      <h3 style="color: var(--green-dark);">Admin Access</h3>
      <p style="font-size: 12px; color: #60766b; margin-top: 4px;">Enter PIN (Default: 8822 or 1234)</p>
      <input type="password" id="adminPin" placeholder="••••" maxlength="6">
      <button class="btn-action btn-update" style="width: 100%; padding: 10px;" onclick="verifyPin()">Unlock Dashboard</button>
    </div>
  </div>

  <header>
    <div style="font-weight: 800; font-size: 17px;">🥦 Fresh Veggie Admin</div>
    <div>
      <a href="index.html" style="color: white; text-decoration: none; font-size: 13px; background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 6px;">Go to Shop</a>
    </div>
  </header>

  <div class="container" id="adminDashboard" style="display:none;">
    <div class="stats-grid">
      <div class="stat-card"><div>Orders</div><div class="stat-num" id="statOrders">0</div></div>
      <div class="stat-card"><div>Total Sales</div><div class="stat-num">₹<span id="statSales">0</span></div></div>
      <div class="stat-card"><div>Pending</div><div class="stat-num" id="statPending">0</div></div>
    </div>
    <div id="adminOrdersList"></div>
  </div>

  <script>
    function verifyPin() {
      var pin = document.getElementById('adminPin').value.trim();
      if (pin === "8822" || pin === "1234") {
        document.getElementById('adminAuthScreen').style.display = "none";
        document.getElementById('adminDashboard').style.display = "flex";
        renderOrders();
      } else {
        alert("Incorrect PIN");
      }
    }

    function renderOrders() {
      var orders = JSON.parse(localStorage.getItem('fv_orders') || '[]');
      var container = document.getElementById('adminOrdersList');
      var totalSales = 0, pending = 0;

      if (!orders.length) {
        container.innerHTML = "<p style='text-align: center; color: #60766b; padding: 20px;'>No orders received yet.</p>";
        document.getElementById('statOrders').innerText = "0";
        document.getElementById('statSales').innerText = "0";
        document.getElementById('statPending').innerText = "0";
        return;
      }

      var html = "";
      orders.slice().reverse().forEach(function(ord, revIdx) {
        var originalIdx = orders.length - 1 - revIdx;
        totalSales += Number(ord.total) || 0;
        var st = ord.status || "Placed";
        if (st !== "Delivered") pending++;

        html += '<div class="order-card">' +
                  '<div class="order-head">' +
                    '<div><span class="order-id">' + ord.orderId + '</span></div>' +
                    '<span class="badge badge-placed">' + st + '</span>' +
                  '</div>' +
                  '<div style="font-size:13px; margin-bottom: 6px;">' +
                    '<b>' + ord.customer + '</b> (' + ord.phone + ')<br>' +
                    '<span style="color:#60766b;">' + (ord.deliveryAddress || (ord.village + ', ' + ord.address)) + '</span>' +
                  '</div>' +
                  '<div style="background:#f9fbf9; padding:8px; border-radius:6px; font-size:12px; margin-bottom:8px;">' +
                    ord.items.map(function(i){ return i.name + ' × ' + i.qty + ' (₹' + (i.price*i.qty) + ')'; }).join('<br>') +
                  '</div>' +
                  '<div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px;">' +
                    '<span>Payment: <b>' + ord.payment + '</b></span>' +
                    '<span style="font-weight:800; color:var(--green-dark);">Total: ₹' + ord.total + '</span>' +
                  '</div>' +
                  '<div style="display:flex; gap:6px;">' +
                    '<select id="st_' + originalIdx + '" style="flex:1; padding:6px; border:1px solid var(--line); border-radius:6px;">' +
                      '<option value="Placed" ' + (st==='Placed'?'selected':'') + '>Placed</option>' +
                      '<option value="Out for Delivery" ' + (st==='Out for Delivery'?'selected':'') + '>Out for Delivery</option>' +
                      '<option value="Delivered" ' + (st==='Delivered'?'selected':'') + '>Delivered</option>' +
                    '</select>' +
                    '<button class="btn-action btn-update" onclick="saveStatus(' + originalIdx + ')">Save</button>' +
                    '<button class="btn-action btn-del" onclick="delOrder(' + originalIdx + ')">✕</button>' +
                  '</div>' +
                '</div>';
      });

      container.innerHTML = html;
      document.getElementById('statOrders').innerText = orders.length;
      document.getElementById('statSales').innerText = totalSales;
      document.getElementById('statPending').innerText = pending;
    }

    function saveStatus(idx) {
      var orders = JSON.parse(localStorage.getItem('fv_orders') || '[]');
      var sel = document.getElementById('st_' + idx);
      if (!sel) return;
      orders[idx].status = sel.value;
      localStorage.setItem('fv_orders', JSON.stringify(orders));
      alert("Order status updated!");
      renderOrders();
    }

    function delOrder(idx) {
      if (!confirm("Delete order record?")) return;
      var orders = JSON.parse(localStorage.getItem('fv_orders') || '[]');
      orders.splice(idx, 1);
      localStorage.setItem('fv_orders', JSON.stringify(orders));
      renderOrders();
    }
  </script>
</body>
</html>
